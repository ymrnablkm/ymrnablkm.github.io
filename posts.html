<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>资源库 · AY</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --accent-1: #8b5cf6;
      --accent-2: #ec4899;
      --accent-3: #06b6d4;
    }
    body {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0f17 0%, #1a1a2e 100%);
      color: #f5f5f7;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      scroll-behavior: smooth;
    }

    /* 背景装饰光斑 */
    .bg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.5;
      pointer-events: none;
      z-index: 0;
      animation: blobFloat 20s ease-in-out infinite;
    }
    .bg-blob.b1 {
      width: 500px; height: 500px;
      top: -100px; left: -100px;
      background: radial-gradient(circle, #6366f1, transparent 70%);
      animation-delay: 0s;
    }
    .bg-blob.b2 {
      width: 600px; height: 600px;
      bottom: -150px; right: -150px;
      background: radial-gradient(circle, #ec4899, transparent 70%);
      animation-delay: -7s;
    }
    .bg-blob.b3 {
      width: 400px; height: 400px;
      top: 40%; left: 40%;
      background: radial-gradient(circle, #06b6d4, transparent 70%);
      animation-delay: -14s;
    }
    @keyframes blobFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(60px, -40px) scale(1.1); }
      66% { transform: translate(-40px, 60px) scale(0.95); }
    }

    /* ===== 汉堡按钮 ===== */
    .menu-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
      z-index: 2001;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    }
    .menu-btn:hover {
      transform: scale(1.08) rotate(-3deg);
      background: rgba(20, 20, 40, 0.7);
      box-shadow: 0 12px 40px rgba(99,102,241,0.35), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .menu-btn:active { transform: scale(0.95); }
    .menu-btn .bars {
      width: 24px;
      height: 20px;
      position: relative;
    }
    .menu-btn .bars span {
      position: absolute;
      left: 0;
      width: 100%;
      height: 2.5px;
      background: #fff;
      border-radius: 2px;
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    }
    .menu-btn .bars span:nth-child(1) { top: 0; }
    .menu-btn .bars span:nth-child(2) { top: 50%; transform: translateY(-50%); width: 75%; }
    .menu-btn .bars span:nth-child(3) { bottom: 0; }

    .menu-btn.open .bars span:nth-child(1) {
      top: 50%; transform: translateY(-50%) rotate(45deg);
    }
    .menu-btn.open .bars span:nth-child(2) {
      opacity: 0; transform: translateY(-50%) scale(0);
    }
    .menu-btn.open .bars span:nth-child(3) {
      bottom: 50%; transform: translateY(50%) rotate(-45deg);
    }

    /* ===== 遮罩层 ===== */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0);
      backdrop-filter: blur(0px);
      -webkit-backdrop-filter: blur(0px);
      z-index: 1999;
      pointer-events: none;
      transition: background 0.4s ease, backdrop-filter 0.4s ease;
    }
    .backdrop.show {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: auto;
    }

    /* ===== 侧边栏 ===== */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 320px;
      max-width: 85vw;
      background: linear-gradient(180deg, rgba(20,20,40,0.85) 0%, rgba(30,30,60,0.85) 100%);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border-right: 1px solid rgba(255,255,255,0.1);
      box-shadow: 4px 0 60px rgba(0,0,0,0.5);
      z-index: 2000;
      transform: translateX(-110%);
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      padding: 100px 32px 40px;
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-title {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #fff, #a0a0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sidebar-subtitle {
      font-size: 0.9rem;
      color: #a1a1aa;
      margin-bottom: 40px;
      letter-spacing: 0.5px;
    }
    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .sidebar-nav a {
      position: relative;
      color: #d1d1d6;
      text-decoration: none;
      font-size: 1.15rem;
      font-weight: 500;
      padding: 16px 20px;
      border-radius: 16px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .sidebar-nav a:hover {
      background: rgba(255,255,255,0.08);
      color: #fff;
      padding-left: 28px;
    }
    .sidebar-nav a.active {
      background: linear-gradient(90deg, rgba(99,102,241,0.25), rgba(236,72,153,0.15));
      color: #fff;
      border: 1px solid rgba(255,255,255,0.08);
    }

    /* ===== 顶部导航栏 ===== */
    header {
      position: fixed;
      top: 16px;
      left: 96px;
      z-index: 1000;
      width: auto;
      max-width: calc(100% - 120px);
      border-radius: 32px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    nav {
      padding: 12px 20px;
      display: flex;
      align-items: center;
    }
    .logo {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #fff, #a0a0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }

    /* ===== 主体 ===== */
    main {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 140px 24px 160px;
    }

    h1 {
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -1.5px;
      line-height: 1.15;
      margin-bottom: 14px;
      background: linear-gradient(90deg, #ffffff, #a0a0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .intro {
      font-size: 1rem;
      color: #a1a1aa;
      max-width: 680px;
      margin-bottom: 40px;
    }

    .breadcrumb {
      font-size: 0.85rem;
      color: #71717a;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }
    .breadcrumb a {
      color: #a1a1aa;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .breadcrumb a:hover { color: #fff; }
    .breadcrumb .sep { margin: 0 6px; opacity: 0.5; }

    /* ===== 资源分享区 ===== */
    .resource-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 24px;
    }
    .resource-count {
      font-size: 0.95rem;
      color: #a1a1aa;
    }
    .resource-count b {
      color: #fff;
      font-size: 1.15rem;
      background: linear-gradient(90deg, #8b5cf6, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 2px;
    }

    /* 搜索框 + 筛选 */
    .toolbar {
      display: flex;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
      align-items: center;
    }
    .search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 14px 20px 14px 48px;
      background: rgba(30, 30, 46, 0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      color: #fff;
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.3s ease;
      outline: none;
    }
    .search-box input::placeholder { color: #71717a; }
    .search-box input:focus {
      border-color: rgba(139, 92, 246, 0.5);
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
      background: rgba(30, 30, 46, 0.6);
    }
    .search-box::before {
      content: '⌕';
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.3rem;
      color: #a1a1aa;
      pointer-events: none;
    }

    .category-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .category-tab {
      padding: 10px 18px;
      background: rgba(30,30,46,0.45);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      color: #d1d1d6;
      cursor: pointer;
      font-size: 0.95rem;
      font-family: inherit;
      font-weight: 500;
      transition: all 0.25s ease;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .category-tab:hover {
      background: rgba(255,255,255,0.08);
      color: #fff;
      transform: translateY(-1px);
    }
    .category-tab.active {
      background: linear-gradient(135deg, #6366f1, #ec4899);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 8px 24px rgba(99,102,241,0.35);
    }
    .category-tab .count {
      margin-left: 6px;
      opacity: 0.75;
      font-size: 0.85rem;
    }

    /* 卡片网格 */
    .resource-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .resource-card {
      position: relative;
      background: rgba(30, 30, 46, 0.45);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.4s cubic-bezier(0.16,1,0.3,1), box-shadow 0.4s ease, border-color 0.4s ease;
      display: flex;
      flex-direction: column;
    }
    .resource-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 60px rgba(99,102,241,0.3);
      border-color: rgba(139, 92, 246, 0.35);
    }
    .resource-card .cover {
      aspect-ratio: 16/9;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      overflow: hidden;
    }
    .resource-card .cover::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--card-gradient, linear-gradient(135deg, #6366f1, #ec4899));
      opacity: 0.9;
      transition: transform 0.8s cubic-bezier(0.16,1,0.3,1);
    }
    .resource-card:hover .cover::before {
      transform: scale(1.1);
    }
    .resource-card .cover::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.25), transparent 50%);
      pointer-events: none;
    }
    .resource-card .cover .emoji {
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
      transition: transform 0.5s cubic-bezier(0.16,1,0.3,1);
    }
    .resource-card:hover .cover .emoji {
      transform: scale(1.15) rotate(-5deg);
    }

    .resource-card .card-body {
      padding: 18px 20px 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .resource-card .tags {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .tag {
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(139, 92, 246, 0.18);
      color: #c4b5fd;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    .tag.size { background: rgba(6, 182, 212, 0.15); color: #67e8f9; }
    .tag.date { background: rgba(236, 72, 153, 0.15); color: #f9a8d4; }

    .resource-card h3 {
      font-size: 1.15rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 8px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .resource-card .desc {
      font-size: 0.92rem;
      color: #a1a1aa;
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 16px;
      flex: 1;
    }
    .resource-card .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .resource-card .link-preview {
      font-size: 0.82rem;
      color: #71717a;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .view-btn {
      padding: 8px 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: #fff;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: inherit;
      font-weight: 500;
      transition: all 0.25s ease;
    }
    .view-btn:hover {
      background: linear-gradient(135deg, #6366f1, #ec4899);
      border-color: transparent;
      transform: translateX(2px);
      box-shadow: 0 6px 20px rgba(99,102,241,0.35);
    }

    /* 空状态 */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: #71717a;
      font-size: 1rem;
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.5; }

    /* ===== 详情弹窗 ===== */
    .detail-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -48%) scale(0.96);
      width: min(760px, 92vw);
      max-height: 86vh;
      background: linear-gradient(180deg, rgba(25,25,45,0.92) 0%, rgba(30,30,60,0.92) 100%);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      box-shadow: 0 30px 100px rgba(0,0,0,0.6);
      z-index: 2005;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.45s cubic-bezier(0.16,1,0.3,1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .detail-modal.show {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }
    .detail-modal .detail-cover {
      height: 180px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      overflow: hidden;
    }
    .detail-modal .detail-cover::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--card-gradient, linear-gradient(135deg, #6366f1, #ec4899));
      opacity: 0.9;
    }
    .detail-modal .detail-cover::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.25), transparent 50%);
    }
    .detail-modal .detail-cover .emoji {
      position: relative; z-index: 1;
      filter: drop-shadow(0 6px 20px rgba(0,0,0,0.35));
    }
    .detail-close {
      position: absolute;
      top: 16px; right: 16px;
      width: 40px; height: 40px;
      border-radius: 12px;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      font-size: 1.4rem;
      cursor: pointer;
      z-index: 3;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      font-family: inherit;
    }
    .detail-close:hover {
      background: rgba(236,72,153,0.4);
      transform: rotate(90deg) scale(1.08);
      border-color: transparent;
    }
    .detail-body {
      padding: 28px 32px 32px;
      overflow-y: auto;
      flex: 1;
    }
    .detail-body::-webkit-scrollbar { width: 6px; }
    .detail-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    .detail-body .tags {
      display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap;
    }
    .detail-body h2 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 14px;
      color: #fff;
      letter-spacing: -0.5px;
      line-height: 1.3;
    }
    .detail-body .meta {
      display: flex; gap: 16px; margin-bottom: 22px; flex-wrap: wrap;
      font-size: 0.9rem; color: #a1a1aa;
    }
    .detail-body .section-label {
      font-size: 0.78rem;
      letter-spacing: 2px;
      color: #71717a;
      text-transform: uppercase;
      font-weight: 600;
      margin: 24px 0 12px;
    }
    .detail-body .full-desc {
      font-size: 1rem;
      color: #d1d1d6;
      line-height: 1.8;
      white-space: pre-wrap;
      background: rgba(255,255,255,0.02);
      padding: 18px 22px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .drive-list { display: flex; flex-direction: column; gap: 12px; }
    .drive-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      transition: all 0.3s ease;
    }
    .drive-item:hover {
      background: rgba(255,255,255,0.05);
      border-color: rgba(139, 92, 246, 0.3);
      transform: translateX(4px);
    }
    .drive-item .drive-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }
    .drive-item .drive-info { flex: 1; min-width: 0; }
    .drive-item .drive-info .name {
      font-weight: 600;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 2px;
    }
    .drive-item .drive-info .code {
      font-size: 0.85rem;
      color: #a1a1aa;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .drive-item .code-box {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      background: rgba(6, 182, 212, 0.15);
      border: 1px dashed rgba(6, 182, 212, 0.35);
      border-radius: 6px;
      color: #67e8f9;
      font-family: 'SF Mono', Menlo, monospace;
      font-weight: 600;
      font-size: 0.82rem;
      letter-spacing: 1px;
    }
    .drive-actions { display: flex; gap: 8px; }
    .btn {
      padding: 10px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: #d1d1d6;
      cursor: pointer;
      font-size: 0.88rem;
      font-family: inherit;
      font-weight: 500;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .btn.primary {
      background: linear-gradient(135deg, #6366f1, #ec4899);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 6px 20px rgba(99,102,241,0.35);
    }
    .btn.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(99,102,241,0.5);
    }
    .btn.copied {
      background: linear-gradient(135deg, #10b981, #059669);
      border-color: transparent;
      color: #fff;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 900px) {
      .resource-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
      main { padding-top: 120px; padding-bottom: 120px; }
      header { top: 12px; left: 88px; right: 12px; border-radius: 24px; }

<body>

  <script>
    /* ============================================================

        fullDesc: "精选 Windows 平台常用便携软件合集，单文件绿色版，无需安装。\n\n包含但不限于：\n• 截图 / 贴图 / 录屏工具\n• 文本与代码编辑器\n• 文件搜索与批量重命名\n• 系统信息查看与清理\n• 多媒体与转换工具\n\n推荐解压到非系统盘，可直接添加到快速启动。",
        size: "860 MB",
        date: "2026-06-08",
        drives: [
          { name: "百度网盘", url: "https://pan.baidu.com/s/xxxxx", code: "ay23" },
          { name: "阿里云盘", url: "https://www.aliyundrive.com/s/xxxxx", code: "—" }
        ]
      },
      {
        id: 3,
        title: "自学编程入门路线图（视频 + 讲义）",
        category: "教程",
        emoji: "📚",
        desc: "从零开始的编程学习路线，配套视频教程与配套讲义，适合零基础或希望系统入门的同学。",
        fullDesc: "自学编程完整路线图（零基础友好）\n\n阶段一：计算机基础 + 网络基础\n阶段二：Python / JavaScript 入门（二选一）\n阶段三：版本控制 + 工程化\n阶段四：项目实战\n\n配套内容：\n• 视频教程（按章节切分）\n• 配套 PDF 讲义与练习\n• 推荐作业与项目清单\n• 学习路线图（PDF 海报）",
        size: "3.6 GB",
        date: "2026-06-05",
        drives: [
          { name: "夸克网盘", url: "https://pan.quark.cn/s/xxxxx", code: "—" },
          { name: "百度网盘", url: "https://pan.baidu.com/s/xxxxx", code: "ay99" }
        ]
      },
      {
        id: 4,
        title: "高清壁纸合集 · 4K 精选（500+ 张）",
        category: "素材",
        emoji: "🖼️",
        desc: "精选 500+ 张高质量 4K 壁纸，涵盖自然、城市、太空、抽象等多种风格，可用于桌面与移动端。",
        fullDesc: "壁纸精选合集，适合桌面 / 移动端 / 会议背景。\n\n• 分辨率：以 4K (3840×2160) 为主\n• 数量：共 500+ 张\n• 风格：自然风景 · 城市建筑 · 太空宇宙 · 抽象艺术 · 极简\n• 文件命名含分辨率与关键词，便于筛选",
        size: "2.4 GB",
        date: "2026-06-02",
        drives: [
          { name: "百度网盘", url: "https://pan.baidu.com/s/xxxxx", code: "ay01" }
        ]
      },
      {
        id: 5,
        title: "笔记与知识管理模板合集（Notion / Obsidian）",
        category: "其他",
        emoji: "🗂️",
        desc: "精选的知识管理模板合集，涵盖读书笔记、项目管理、GTD、学习计划等，可直接导入 Notion / Obsidian。",
        fullDesc: "笔记与知识管理模板合集，开箱即用。\n\nNotion 模板：\n• 读书笔记 · 电影笔记 · 旅行日志\n• 项目管理 · 周计划 / 月计划\n• 个人主页 + 仪表盘\n\nObsidian 模板：\n• 每日笔记模板\n• MOC (Map of Content) 示例\n• 卡片盒笔记法全套模板",
        size: "45 MB",
        date: "2026-05-28",
        drives: [
          { name: "夸克网盘", url: "https://pan.quark.cn/s/xxxxx", code: "—" },
          { name: "阿里云盘", url: "https://www.aliyundrive.com/s/xxxxx", code: "—" }
        ]
      },
      {
        id: 6,
        title: "字体包 · 中英文商用友好精选",
        category: "素材",
        emoji: "🔤",
        desc: "收录一批可商用（或个人免费商用）的高质量中英文字体，已按类别整理，适合文档、PPT、设计使用。",
        fullDesc: "精选字体合集，已按授权方式分类归档。\n\n中文字体（衬线/无衬线/手写）\n英文字体（Display / Sans / Mono）\n字体文件格式：TTF / OTF\n\n⚠️ 请在使用前阅读每个字体的授权说明，商业使用请购买授权或确认免费商用。",
        size: "1.2 GB",
        date: "2026-05-20",
        drives: [
          { name: "百度网盘", url: "https://pan.baidu.com/s/xxxxx", code: "ay55" },
          { name: "夸克网盘", url: "https://pan.quark.cn/s/xxxxx", code: "—" }
        ]
      }
    ];

    const GRADIENTS = {
      "素材": 'linear-gradient(135deg, #6366f1 0%, #a855f7 100%)',
      "软件": 'linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%)',
      "教程": 'linear-gradient(135deg, #f97316 0%, #ec4899 100%)',
      "其他": 'linear-gradient(135deg, #10b981 0%, #06b6d4 100%)'
    };

    /* ===== 渲染逻辑 ===== */
    const grid = document.getElementById('resourceGrid');
    const tabsEl = document.getElementById('categoryTabs');
    const totalCountEl = document.getElementById('totalCount');
    const searchInput = document.getElementById('searchInput');
    const modal = document.getElementById('detailModal');
    const modalBody = document.getElementById('detailBody');
    const modalEmoji = document.getElementById('detailEmoji');
    const modalClose = document.getElementById('detailClose');
    const backdrop = document.getElementById('backdrop');

    // 从 URL 读取初始分类 (?cat=素材)
    function getInitialCategory() {
      const params = new URLSearchParams(window.location.search);
      const cat = params.get('cat');
      if (cat && RESOURCES.some(r => r.category === cat)) return cat;
      return '全部';
    }
    let currentCategory = getInitialCategory();
    let currentKeyword = '';

    function getGradient(category) {
      return GRADIENTS[category] || 'linear-gradient(135deg, #6366f1, #ec4899)';
    }

    function renderTabs() {
      const categories = ['全部', ...Array.from(new Set(RESOURCES.map(r => r.category)))];
      tabsEl.innerHTML = categories.map(cat => {
        const count = cat === '全部' ? RESOURCES.length : RESOURCES.filter(r => r.category === cat).length;
        return `<button class="category-tab ${cat === currentCategory ? 'active' : ''}" data-cat="${cat}">${cat}<span class="count">${count}</span></button>`;
      }).join('');
      tabsEl.querySelectorAll('.category-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          currentCategory = btn.dataset.cat;
          renderTabs();
          renderGrid();
        });
      });
    }

    function getFiltered() {
      return RESOURCES.filter(r => {
        const matchCat = currentCategory === '全部' || r.category === currentCategory;
        if (!matchCat) return false;
        if (!currentKeyword) return true;
        const kw = currentKeyword.toLowerCase();
        return (
          r.title.toLowerCase().includes(kw) ||
          r.desc.toLowerCase().includes(kw) ||
          r.category.toLowerCase().includes(kw) ||
          (r.fullDesc && r.fullDesc.toLowerCase().includes(kw))
        );
      });
    }

    function renderGrid() {
      const list = getFiltered();
      totalCountEl.textContent = list.length;

      if (list.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="icon">🔍</div>
            <div>暂时没有匹配的资源，换个关键词试试～</div>
          </div>`;
        return;
      }

      grid.innerHTML = list.map((r, idx) => {
        const gradient = getGradient(r.category);
        const driveCount = r.drives.length;
        return `
          <article class="resource-card" id="post-${r.id}" data-id="${r.id}" style="animation-delay: ${Math.min(idx * 0.06, 0.5)}s; --card-gradient: ${gradient};">
            <div class="cover">
              <span class="emoji">${r.emoji}</span>
            </div>
            <div class="card-body">
              <div class="tags">
                <span class="tag">${r.category}</span>
                <span class="tag size">${r.size}</span>
                <span class="tag date">${r.date}</span>
              </div>
              <h3>${escapeHTML(r.title)}</h3>
              <div class="desc">${escapeHTML(r.desc)}</div>
              <div class="card-footer">
                <span class="link-preview">${driveCount} 个网盘 · 查看详情 →</span>
                <button class="view-btn">查看</button>
              </div>
            </div>
          </article>
        `;
      }).join('');

      grid.querySelectorAll('.resource-card').forEach(card => {
        card.addEventListener('click', () => {
          const id = Number(card.dataset.id);
          openDetail(id);
        });
      });
    }

    function openDetail(id) {
      const r = RESOURCES.find(x => x.id === id);
      if (!r) return;
      const gradient = getGradient(r.category);
      modal.style.setProperty('--card-gradient', gradient);
      modalEmoji.textContent = r.emoji;

      const tags = `
        <div class="tags">
          <span class="tag">${r.category}</span>
          <span class="tag size">${r.size}</span>
          <span class="tag date">更新于 ${r.date}</span>
        </div>`;

      const drives = (r.drives || []).map(d => `
        <div class="drive-item">
          <div class="drive-icon">☁</div>
          <div class="drive-info">
            <div class="name">${escapeHTML(d.name)}</div>
            <div class="code">
              提取码：
              ${d.code && d.code !== '—'
                ? `<span class="code-box">${escapeHTML(d.code)}</span> <button class="btn copy-btn" data-copy="${escapeHTML(d.code)}">复制</button>`
                : `<span style="color:#71717a;">无</span>`}
            </div>
          </div>
          <div class="drive-actions">
            <a class="btn primary" href="${d.url}" target="_blank" rel="noopener noreferrer">前往下载 →</a>
          </div>
        </div>
      `).join('');

      modalBody.innerHTML = `
        ${tags}
        <h2>${escapeHTML(r.title)}</h2>
        <div class="section-label">资源介绍</div>
        <div class="full-desc">${escapeHTML(r.fullDesc || r.desc)}</div>
        <div class="section-label">下载链接</div>
        <div class="drive-list">${drives}</div>
      `;

      modalBody.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault(); e.stopPropagation();
          const text = btn.dataset.copy;
          copyText(text).then(() => {
            const original = btn.textContent;
            btn.textContent = '已复制 ✓';
            btn.classList.add('copied');
            setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1600);
          }).catch(() => {
            btn.textContent = '复制失败';
            setTimeout(() => { btn.textContent = '复制'; }, 1200);
          });
        });
      });

      modal.classList.add('show');
      backdrop.classList.add('show');
      document.body.classList.add('no-scroll');
    }

    function closeDetail() {
      modal.classList.remove('show');
      if (!document.getElementById('sidebar').classList.contains('open')) {
        backdrop.classList.remove('show');
      }
      document.body.classList.remove('no-scroll');
    }
    modalClose.addEventListener('click', closeDetail);

    // 工具函数
    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }
      return new Promise((resolve, reject) => {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          resolve();
        } catch (e) { reject(e); }
      });
    }

    // 搜索框
    let searchTimer = null;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        currentKeyword = e.target.value.trim();
        renderGrid();
      }, 180);
    });

    /* ===== 侧边栏控制 ===== */
    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');

    function toggleSidebar(forceClose) {
      const willOpen = forceClose ? false : !sidebar.classList.contains('open');
      if (willOpen) {
        sidebar.classList.add('open');
        menuBtn.classList.add('open');
        backdrop.classList.add('show');
        document.body.classList.add('no-scroll');
        menuBtn.setAttribute('aria-expanded', 'true');
        sidebar.setAttribute('aria-hidden', 'false');
      } else {
        sidebar.classList.remove('open');
        menuBtn.classList.remove('open');
        if (!modal.classList.contains('show')) {
          backdrop.classList.remove('show');
        }
        if (!modal.classList.contains('show')) {
          document.body.classList.remove('no-scroll');
        }
        menuBtn.setAttribute('aria-expanded', 'false');
        sidebar.setAttribute('aria-hidden', 'true');
      }
    }
    menuBtn.addEventListener('click', () => toggleSidebar());

    // 点击遮罩：关闭所有打开的内容
    backdrop.addEventListener('click', () => {
      if (sidebar.classList.contains('open')) toggleSidebar(true);
      if (modal.classList.contains('show')) closeDetail();
    });

    // Esc 键：关闭最上层的
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (modal.classList.contains('show')) {
          closeDetail();
        } else if (sidebar.classList.contains('open')) {
          toggleSidebar(true);
        }
      }
    });

    // 点击弹窗外部关闭
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeDetail();
    });

    /* ===== 鼠标视差：背景光斑 ===== */
    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 20;
      const y = (e.clientY / window.innerHeight - 0.5) * 20;
      document.querySelectorAll('.bg-blob').forEach((blob, i) => {
        const factor = (i + 1) * 0.6;
        blob.style.transform = `translate(${x * factor}px, ${y * factor}px)`;
      });
    });

    /* ===== 初次渲染 + URL 中的锚点处理（从首页热门卡片跳转） ===== */
    renderTabs();
    renderGrid();

    // 如 URL 中有 #post-<id> 则自动打开对应详情
    const hash = window.location.hash;
    const match = hash && hash.match(/^#post-(\d+)$/);
    if (match) {
      const targetId = Number(match[1]);
      // 稍作延迟，让卡片先渲染完
      setTimeout(() => {
        const el = document.getElementById(`post-${targetId}`);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          setTimeout(() => openDetail(targetId), 350);
        }
      }, 200);
    }
  </script>
