<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>软件库 · Aether Yard</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
  <button class="menu-toggle" id="menuToggle" aria-label="菜单">☰</button>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="app-container">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="sidebar-header-close" id="sidebarClose" aria-label="关闭">✕</button>
        <div>
          <div class="logo-text">Aether Yard</div>
          <div class="logo-sub">RESOURCE HUB</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">导航</div>
          <a href="index.html" class="nav-link"><span class="icon">⌂</span> 首页</a>
          <a href="software.html" class="nav-link active"><span class="icon">⊞</span> 软件库</a>
          <a href="sites.html" class="nav-link"><span class="icon">🔗</span> 外站导航</a>
          <a href="about.html" class="nav-link"><span class="icon">◉</span> 关于</a>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">快捷分类</div>
          <a href="software.html?cat=软件" class="nav-link"><span class="icon">▣</span> 软件工具</a>
          <a href="software.html?cat=影视动漫" class="nav-link"><span class="icon">▶</span> 影视动漫</a>
          <a href="software.html?cat=PC工具" class="nav-link"><span class="icon">⚙</span> PC 工具</a>
          <a href="software.html?cat=游戏相关" class="nav-link"><span class="icon">🎮</span> 游戏相关</a>
          <a href="software.html?cat=其他" class="nav-link"><span class="icon">◇</span> 其他资源</a>
        </div>
      </nav>

      <div class="sidebar-sites">
        <div class="nav-section-title">常用站点</div>
        <a href="https://github.com" target="_blank" class="site-link"><span class="favicon">G</span> GitHub</a>
        <a href="https://figma.com" target="_blank" class="site-link"><span class="favicon">F</span> Figma</a>
        <a href="https://code.visualstudio.com" target="_blank" class="site-link"><span class="favicon">V</span> VS Code</a>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main">
      <!-- 列表视图 -->
      <section id="listView">
        <!-- 工具栏 -->
        <div class="toolbar">
          <div class="search-bar">
            <span class="search-icon">⌕</span>
            <input type="text" id="searchInput" placeholder="搜索名称、描述、标签...">
          </div>
          <div class="filter-bar" id="filterBar">
            <button class="filter-btn active" data-cat="">全部</button>
            <button class="filter-btn" data-cat="软件">软件</button>
            <button class="filter-btn" data-cat="影视动漫">影视动漫</button>
            <button class="filter-btn" data-cat="PC工具">PC 工具</button>
            <button class="filter-btn" data-cat="游戏相关">游戏</button>
            <button class="filter-btn" data-cat="其他">其他</button>
          </div>
        </div>

        <!-- 卡片网格 -->
        <div class="card-grid" id="softwareGrid"></div>
      </section>

      <!-- 详情视图 -->
      <section id="detailView" class="detail-view" style="display:none;"></section>
    </main>
  </div>

  <!-- 图片预览模态 -->
  <div class="image-modal" id="imageModal">
    <img id="modalImage" src="" alt="预览">
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // ====== 工具函数 ======
    function escapeHTML(str) {
      return String(str || '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d)) return '';
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}.${m}.${day}`;
    }

    function showToast(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show ' + (type || '');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    function renderEmpty(text) {
      return `<div class="empty-state" style="grid-column: 1 / -1;">
        <div class="empty-icon">◇</div>
        <div class="empty-text">${escapeHTML(text)}</div>
      </div>`;
    }

    // ====== URL 参数 ======
    function getQueryParam(key) {
      const p = new URLSearchParams(window.location.search);
      return p.get(key);
    }

    function updateURL(params) {
      const url = new URL(window.location.href);
      Object.keys(params).forEach(k => {
        if (params[k] === null || params[k] === undefined || params[k] === '')
          url.searchParams.delete(k);
        else
          url.searchParams.set(k, params[k]);
      });
      history.replaceState(null, '', url.toString());
    }

    // ====== 状态 ======
    let DATA = [];
    let currentCategory = getQueryParam('cat') || '';
    let currentSearch = '';

    // ====== 渲染卡片 ======
    function renderCardItem(item) {
      const cover = item.cover || (item.images && item.images[0]) || '';
      const coverHTML = cover
        ? `<img class="card-image" src="${escapeHTML(cover)}" alt="${escapeHTML(item.title)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
           <div class="card-image-placeholder" style="display:none;">📦</div>`
        : `<div class="card-image-placeholder">📦</div>`;

      const tags = (item.tags && item.tags.length > 0)
        ? `<div class="card-tags">${item.tags.slice(0, 3).map(t => `<span class="tag">${escapeHTML(t)}</span>`).join('')}</div>`
        : '';

      const badge = (item.featured || item.pinned)
        ? `<span class="card-badge">精选</span>`
        : '';

      return `<article class="software-card" data-id="${escapeHTML(item.id)}" onclick="openDetail('${encodeURIComponent(item.id)}')">
        <div class="card-media">
          ${badge}
          ${coverHTML}
        </div>
        <div class="card-body">
          <div class="card-header">
            <div class="card-title">${escapeHTML(item.title)}</div>
            <div class="card-category">${escapeHTML(item.category || '其他')}</div>
          </div>
          <div class="card-desc">${escapeHTML(item.description || '暂无简介')}</div>
          ${tags}
        </div>
        <div class="card-footer">
          <span class="card-date">${formatDate(item.createdAt || item.updatedAt) || '—'}</span>
          <span class="card-action">查看 →</span>
        </div>
      </article>`;
    }

    // ====== 渲染列表 ======
    function renderList() {
      const grid = document.getElementById('softwareGrid');
      if (!DATA || DATA.length === 0) {
        grid.innerHTML = renderEmpty('暂无资源');
        return;
      }

      let filtered = DATA;
      if (currentCategory) {
        filtered = filtered.filter(i => (i.category || '其他') === currentCategory);
      }
      if (currentSearch) {
        const q = currentSearch.toLowerCase();
        filtered = filtered.filter(i => {
          const hay = [
            i.title, i.description, i.category,
            (i.tags || []).join(' ')
          ].filter(Boolean).join(' ').toLowerCase();
          return hay.includes(q);
        });
      }

      filtered = [...filtered].sort((a, b) =>
        new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

      grid.innerHTML = filtered.length > 0
        ? filtered.map(item => renderCardItem(item)).join('')
        : renderEmpty('未找到匹配的资源');
    }

    // ====== 渲染详情 ======
    function renderDetail(item) {
      const listView = document.getElementById('listView');
      const detailView = document.getElementById('detailView');
      listView.style.display = 'none';
      detailView.style.display = 'block';
      detailView.classList.add('active');

      const cover = item.cover || (item.images && item.images[0]) || '';
      const heroHTML = cover
        ? `<img class="detail-hero-image" src="${escapeHTML(cover)}" alt="${escapeHTML(item.title)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
           <div class="detail-hero-placeholder" style="display:none;">📦</div>`
        : `<div class="detail-hero-placeholder">📦</div>`;

      const metaChips = [
        item.category ? `<span class="meta-chip">${escapeHTML(item.category)}</span>` : '',
        item.createdAt ? `<span class="meta-chip">发布于 ${formatDate(item.createdAt)}</span>` : '',
        item.updatedAt ? `<span class="meta-chip">更新于 ${formatDate(item.updatedAt)}</span>` : '',
        (item.version && item.version !== item.title) ? `<span class="meta-chip">${escapeHTML(item.version)}</span>` : ''
      ].filter(Boolean).join('');

      const previewHTML = (item.images && item.images.length > 0)
        ? `<section class="section">
             <div class="section-header"><div class="section-title">预览图</div></div>
             <div class="preview-grid">
               ${item.images.map(img => `<img src="${escapeHTML(img)}" alt="preview" onclick="openImageModal('${escapeHTML(img)}')">`).join('')}
             </div>
           </section>`
        : '';

      const drivesHTML = (item.drives && item.drives.length > 0)
        ? `<section class="section">
             <div class="section-header"><div class="section-title">下载</div></div>
             <div class="download-section">
               <div class="download-list">
                 ${item.drives.map(d => `
                   <div class="download-item">
                     <div>
                       <div class="download-item-title">${escapeHTML(d.name || '下载链接')}</div>
                       ${d.code ? `<div class="download-item-code">提取码: ${escapeHTML(d.code)}</div>` : ''}
                     </div>
                     <a href="${escapeHTML(d.url)}" target="_blank" class="btn btn-primary btn-sm">前往下载 →</a>
                   </div>
                 `).join('')}
               </div>
             </div>
           </section>`
        : '';

      detailView.innerHTML = `
        <button class="back-btn" onclick="backToList()">← 返回列表</button>
        <section class="detail-hero">
          ${heroHTML}
          <div class="detail-hero-body">
            <h1 class="detail-title">${escapeHTML(item.title)}</h1>
            <div class="detail-meta">${metaChips}</div>
            ${(item.tags && item.tags.length > 0)
              ? `<div class="detail-meta">${item.tags.map(t => `<span class="meta-chip">#${escapeHTML(t)}</span>`).join('')}</div>`
              : ''}
            ${item.description ? `<p class="detail-desc" style="margin-top:24px;line-height:1.9;">${escapeHTML(item.description).replace(/\n/g,'<br>')}</p>` : ''}
          </div>
        </section>
        ${previewHTML}
        ${drivesHTML}
      `;

      document.title = `${item.title} · Aether Yard`;
      window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
    }

    function openDetail(id) {
      const item = DATA.find(d => String(d.id) === String(id));
      if (!item) {
        showToast('未找到该资源', 'error');
        return;
      }
      updateURL({ id: id, cat: null });
      renderDetail(item);
    }

    function backToList() {
      const listView = document.getElementById('listView');
      const detailView = document.getElementById('detailView');
      detailView.style.display = 'none';
      detailView.classList.remove('active');
      listView.style.display = 'block';
      updateURL({ id: null, cat: currentCategory || null });
      document.title = '软件库 · Aether Yard';
    }

    // ====== 图片预览 ======
    const imageModal = document.getElementById('imageModal');
    const modalImage = document.getElementById('modalImage');
    imageModal.addEventListener('click', () => imageModal.classList.remove('show'));

    function openImageModal(src) {
      modalImage.src = src;
      imageModal.classList.add('show');
    }

    // ====== 侧边栏交互 ======
    const menuToggle = document.getElementById('menuToggle');
    const sidebarClose = document.getElementById('sidebarClose');
    const overlay = document.getElementById('sidebarOverlay');

    function openSidebar() { document.body.classList.add('sidebar-open'); }
    function closeSidebar() { document.body.classList.remove('sidebar-open'); }

    menuToggle.addEventListener('click', openSidebar);
    sidebarClose.addEventListener('click', closeSidebar);
    overlay.addEventListener('click', closeSidebar);

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        closeSidebar();
        if (imageModal.classList.contains('show')) imageModal.classList.remove('show');
      }
    });

    // ====== 筛选 + 搜索绑定 ======
    const filterBar = document.getElementById('filterBar');
    filterBar.addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      filterBar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCategory = btn.dataset.cat || '';
      updateURL({ cat: currentCategory || null, id: null });
      renderList();
    });

    const searchInput = document.getElementById('searchInput');
    let searchTimer = null;
    searchInput.addEventListener('input', e => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        currentSearch = e.target.value.trim().toLowerCase();
        renderList();
      }, 180);
    });

    // 设置初始分类按钮状态
    if (currentCategory) {
      filterBar.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.cat === currentCategory);
      });
    }

    // ====== 数据加载 ======
    function loadData() {
      return fetch('data/software.json')
        .then(r => r.ok ? r.json() : [])
        .catch(() => []);
    }

    loadData().then(data => {
      DATA = Array.isArray(data) ? data : [];
      DATA.forEach(s => {
        if (!s.description && s.desc) s.description = s.desc;
        if (s.content && !s.description) s.description = s.content;
      });
      const id = getQueryParam('id');
      if (id) {
        const item = DATA.find(d => String(d.id) === String(id));
        if (item) { renderDetail(item); return; }
      }
      renderList();
    });
  </script>
</body>
</html>
