<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>软件库 · Aether Yard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <button class="menu-toggle" id="menuToggle">☰</button>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="app-container">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-header-inner">
          <div class="logo">AY</div>
          <div class="logo-sub">Software Repository</div>
        </div>
        <button class="sidebar-close" onclick="closeSidebar()">✕</button>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">导航</div>
          <a href="index.html" class="nav-link"><span class="icon">⌂</span> 首页</a>
          <a href="software.html" class="nav-link active"><span class="icon">⊞</span> 软件库</a>
          <a href="sites.html" class="nav-link"><span class="icon">🔗</span> 外站导航</a>
          <a href="about.html" class="nav-link"><span class="icon">◉</span> 关于</a>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">快捷分类</div>
          <a href="software.html?cat=软件" class="nav-link"><span class="icon">⊞</span> 软件工具</a>
          <a href="software.html?cat=资源" class="nav-link"><span class="icon">◈</span> 设计资源</a>
          <a href="software.html?cat=游戏" class="nav-link"><span class="icon">⬡</span> 游戏相关</a>
        </div>
      </nav>

      <div class="sidebar-sites">
        <div class="nav-section-title">常用站点</div>
        <a href="https://github.com" target="_blank" class="site-link"><span class="favicon">G</span> GitHub</a>
        <a href="https://notion.so" target="_blank" class="site-link"><span class="favicon">N</span> Notion</a>
        <a href="https://figma.com" target="_blank" class="site-link"><span class="favicon">F</span> Figma</a>
      </div>
    </aside>

    <!-- 主内容 -->
    <main class="main-content" id="mainContent">
      <!-- 列表视图 -->
      <div id="listView">
        <div class="page-header">
          <h1 class="page-title">软件库</h1>
          <p class="page-subtitle">发现优质工具与数字资源</p>
        </div>

        <!-- 搜索和筛选 -->
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="搜索软件名称、描述或标签...">
        </div>

        <div class="filter-bar" id="filterBar">
          <button class="filter-btn active" data-cat="">全部</button>
          <button class="filter-btn" data-cat="软件">软件工具</button>
          <button class="filter-btn" data-cat="资源">设计资源</button>
          <button class="filter-btn" data-cat="游戏">游戏相关</button>
          <button class="filter-btn" data-cat="其他">其他</button>
        </div>

        <div id="softwareGrid" class="card-grid">
          <div class="loading"><div class="loading-spinner"></div></div>
        </div>
      </div>

      <!-- 详情视图 -->
      <div id="detailView" style="display: none;">
        <!-- 动态加载详情内容 -->
      </div>
    </main>
  </div>

  <!-- 图片预览模态框 -->
  <div class="modal-overlay" id="imageModal">
    <div class="modal" style="max-width: 90vw; background: transparent; border: none;">
      <button class="modal-close" onclick="closeImageModal()" style="position: absolute; top: -50px; right: 0; color: white;">✕</button>
      <img id="modalImage" src="" alt="" style="max-width: 100%; max-height: 85vh; border-radius: 12px;">
    </div>
  </div>

  <script>
    let allSoftware = [];
    let currentCategory = '';
    let currentSearch = '';

    // 获取 URL 参数
    function getUrlParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    // 转义 HTML
    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // 加载数据
    async function loadData() {
      try {
        const response = await fetch('data/software.json');
        allSoftware = await response.json();
        render();
      } catch (error) {
        console.error('加载失败:', error);
        document.getElementById('softwareGrid').innerHTML = '<div class="empty-state"><p>数据加载失败</p></div>';
      }
    }

    // 渲染列表
    function renderList() {
      let filtered = allSoftware;
      
      // 分类筛选
      if (currentCategory) {
        filtered = filtered.filter(s => s.category === currentCategory);
      }
      
      // 搜索筛选
      if (currentSearch) {
        const query = currentSearch.toLowerCase();
        filtered = filtered.filter(s => 
          s.title.toLowerCase().includes(query) ||
          s.desc.toLowerCase().includes(query) ||
          (s.tags && s.tags.some(t => t.toLowerCase().includes(query)))
        );
      }
      
      if (filtered.length === 0) {
        document.getElementById('softwareGrid').innerHTML = `
          <div class="empty-state" style="grid-column: 1/-1;">
            <div class="icon">◇</div>
            <h3>暂无软件</h3>
            <p>试试其他筛选条件</p>
          </div>
        `;
        return;
      }
      
      const html = filtered.map((s, i) => `
        <a href="software.html?id=${s.id}" class="software-card stagger-${(i % 6) + 1}" style="text-decoration: none;">
          <div class="card-cover">
            ${s.cover 
              ? `<img src="${s.cover}" alt="${escapeHTML(s.title)}" loading="lazy">`
              : `<div class="card-cover-placeholder">⊞</div>`
            }
            ${s.pinned ? '<span class="card-badge">置顶</span>' : ''}
          </div>
          <div class="card-body">
            <span class="card-category">${escapeHTML(s.category)}</span>
            <h3 class="card-title">${escapeHTML(s.title)}</h3>
            <p class="card-desc">${escapeHTML(s.desc)}</p>
            <div class="card-meta">
              <span>◷ ${escapeHTML(s.version || '—')}</span>
              <span>◧ ${escapeHTML(s.size)}</span>
            </div>
          </div>
        </a>
      `).join('');
      
      document.getElementById('softwareGrid').innerHTML = html;
    }

    // 渲染详情
    function renderDetail(software) {
      const images = software.images || [];
      const imageGallery = images.length > 0 
        ? `<div class="image-gallery">
            ${images.map(img => `
              <div class="gallery-item" onclick="openImageModal('${escapeHTML(img)}')">
                <img src="${escapeHTML(img)}" alt="预览图" loading="lazy">
              </div>
            `).join('')}
           </div>`
        : '';
      
      const drives = software.drives || [];
      const downloadList = drives.map(d => `
        <div class="download-item">
          <div class="download-item-name">
            <span>${escapeHTML(d.name)}</span>
            ${d.code && d.code !== '—' 
              ? `<span class="download-item-code">提取码: ${escapeHTML(d.code)}</span>` 
              : ''}
          </div>
          <a href="${escapeHTML(d.url)}" target="_blank" class="btn btn-primary btn-sm">下载 →</a>
        </div>
      `).join('');
      
      // 格式化内容
      const contentLines = (software.content || '').split('\n');
      const contentHtml = contentLines.map(line => {
        if (line.startsWith('•') || line.startsWith('-')) {
          return `<li style="margin-left: 20px; color: var(--text-secondary);">${escapeHTML(line.substring(1).trim())}</li>`;
        }
        if (line.trim() === '') return '<br>';
        return `<p>${escapeHTML(line)}</p>`;
      }).join('');
      
      const tags = software.tags || [];
      const tagsHtml = tags.length > 0
        ? `<div style="display: flex; gap: 8px; flex-wrap: wrap;">
            ${tags.map(t => `<span class="tag tag-accent">${escapeHTML(t)}</span>`).join('')}
           </div>`
        : '';
      
      const html = `
        <div class="breadcrumb">
          <a href="software.html">← 返回软件库</a>
        </div>
        
        <div class="detail-header">
          <div class="detail-cover">
            ${software.cover 
              ? `<img src="${escapeHTML(software.cover)}" alt="${escapeHTML(software.title)}">`
              : `<div class="detail-cover-placeholder">⊞</div>`
            }
          </div>
          
          <h1 class="detail-title">${escapeHTML(software.title)}</h1>
          
          <div class="detail-meta">
            <div class="detail-meta-item">
              <span class="icon">◈</span>
              <span>${escapeHTML(software.category)}</span>
            </div>
            ${software.version ? `
            <div class="detail-meta-item">
              <span class="icon">◷</span>
              <span>${escapeHTML(software.version)}</span>
            </div>
            ` : ''}
            <div class="detail-meta-item">
              <span class="icon">◧</span>
              <span>${escapeHTML(software.size)}</span>
            </div>
            <div class="detail-meta-item">
              <span class="icon">◷</span>
              <span>${escapeHTML(software.createdAt)}</span>
            </div>
          </div>
          
          <p style="color: var(--text-secondary); font-size: 1.1rem; line-height: 1.8; margin-bottom: 24px;">
            ${escapeHTML(software.desc)}
          </p>
          
          ${tagsHtml}
        </div>
        
        ${imageGallery}
        
        <div class="content-section">
          <h3 style="margin-bottom: 16px;">详细介绍</h3>
          <div style="color: var(--text-secondary); line-height: 2;">
            ${contentHtml}
          </div>
        </div>
        
        ${downloadList ? `
        <div class="download-section">
          <div class="download-title">
            <span class="icon">⬇</span>
            下载地址
          </div>
          <div class="download-list">
            ${downloadList}
          </div>
        </div>
        ` : ''}
      `;
      
      document.getElementById('detailView').innerHTML = html;
    }

    // 渲染
    function render() {
      const id = getUrlParam('id');
      
      if (id) {
        const software = allSoftware.find(s => s.id === id);
        if (software) {
          document.getElementById('listView').style.display = 'none';
          document.getElementById('detailView').style.display = 'block';
          document.getElementById('detailView').style.animation = 'fadeInUp 0.4s ease-out';
          renderDetail(software);
          document.title = `${software.title} · Aether Yard`;
        } else {
          document.getElementById('listView').style.display = 'block';
          document.getElementById('detailView').style.display = 'none';
          document.getElementById('softwareGrid').innerHTML = '<div class="empty-state"><p>未找到该软件</p></div>';
        }
      } else {
        document.getElementById('listView').style.display = 'block';
        document.getElementById('detailView').style.display = 'none';
        renderList();
      }
    }

    // 搜索
    document.getElementById('searchInput').addEventListener('input', (e) => {
      currentSearch = e.target.value;
      renderList();
    });

    // 分类筛选
    document.getElementById('filterBar').addEventListener('click', (e) => {
      if (e.target.classList.contains('filter-btn')) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        e.target.classList.add('active');
        currentCategory = e.target.dataset.cat;
        renderList();
      }
    });

    // 图片模态框
    function openImageModal(src) {
      document.getElementById('modalImage').src = src;
      document.getElementById('imageModal').classList.add('show');
      document.body.style.overflow = 'hidden';
    }

    function closeImageModal() {
      document.getElementById('imageModal').classList.remove('show');
      document.body.style.overflow = '';
    }

    document.getElementById('imageModal').addEventListener('click', (e) => {
      if (e.target.id === 'imageModal') closeImageModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeImageModal();
    });

    // 移动端菜单
    document.getElementById('menuToggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebarOverlay').classList.toggle('show');
      document.body.classList.toggle('sidebar-open');
    });
    
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').classList.remove('show');
      document.body.classList.remove('sidebar-open');
    }
    
    document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);

    // 初始化 - 检查 URL 中的分类参数
    const catParam = getUrlParam('cat');
    if (catParam) {
      currentCategory = catParam;
    }

    loadData();
  </script>
</body>
</html>
