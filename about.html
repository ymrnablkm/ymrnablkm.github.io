<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>关于 · Aether Yard</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
  <button class="menu-toggle" id="menuToggle" aria-label="菜单">☰</button>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="sidebar-header-close" id="sidebarClose" aria-label="关闭">✕</button>
        <div>
          <div class="logo-text">Aether Yard</div>
          <div class="logo-sub">RESOURCE HUB</div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">导航</div>
          <a href="index.html" class="nav-link"><span class="icon">⌂</span> 首页</a>
          <a href="software.html" class="nav-link"><span class="icon">⊞</span> 软件库</a>
          <a href="sites.html" class="nav-link"><span class="icon">🔗</span> 外站导航</a>
          <a href="about.html" class="nav-link active"><span class="icon">◉</span> 关于</a>
        </div>
      </nav>
    </aside>

    <main class="main">
      <section class="hero" style="padding: var(--space-8) 0 var(--space-6);">
        <span class="hero-label">ABOUT · US</span>
        <h1 class="hero-title">关于本站</h1>
        <p class="hero-subtitle">一个简洁、自由的软件与资源分享站。</p>
      </section>

      <section class="about-content">
        <p>Aether Yard 是一个面向开发者和普通用户的资源分享站，汇集精选软件、影视动漫、创作素材及其他实用工具。</p>

        <h3>本站特色</h3>
        <ul>
          <li>极简深色界面，保护视力</li>
          <li>响应式设计，手机 / 平板 / 桌面皆可使用</li>
          <li>分类清晰，搜索便捷</li>
          <li>每个资源独立页面，附预览图与下载链接</li>
          <li>后台发布管理，自由度高</li>
        </ul>

        <h3>免责声明</h3>
        <p>本站仅作资源整理与分享，所有软件版权归原作者所有。若内容侵犯了您的权益，请联系我们处理。</p>
      </section>
    </main>
  </div>

  <script>
    const menuToggle = document.getElementById('menuToggle');
    const sidebarClose = document.getElementById('sidebarClose');
    const overlay = document.getElementById('sidebarOverlay');
    menuToggle.addEventListener('click', () => document.body.classList.add('sidebar-open'));
    sidebarClose.addEventListener('click', () => document.body.classList.remove('sidebar-open'));
    overlay.addEventListener('click', () => document.body.classList.remove('sidebar-open'));
  </script>
</body>
</html>
