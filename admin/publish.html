<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>发布资源 · Aether Yard</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
  <div class="app-container" style="grid-template-columns: 1fr;">
    <main class="main">
      <div class="admin-header">
        <div>
          <h1 class="admin-title">发布资源</h1>
          <div class="admin-subtitle">ADMIN · PUBLISH</div>
        </div>
        <nav class="admin-nav">
          <a href="publish.html" class="admin-btn active">发布</a>
          <a href="manage.html" class="admin-btn">管理</a>
          <a href="../index.html" class="admin-btn">首页</a>
        </nav>
      </div>

      <form class="form-card" id="publishForm" autocomplete="off">
        <div class="form-grid">
          <div class="form-group full">
            <label class="form-label">标题 *</label>
            <input type="text" class="form-input" id="f-title" placeholder="如：Visual Studio Code" required>
          </div>

          <div class="form-group">
            <label class="form-label">分类</label>
            <select class="form-select" id="f-category">
              <option value="软件">软件</option>
              <option value="影视动漫">影视动漫</option>
              <option value="PC工具">PC 工具</option>
              <option value="游戏相关">游戏相关</option>
              <option value="其他">其他</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">版本</label>
            <input type="text" class="form-input" id="f-version" placeholder="如：1.0.0">
          </div>

          <div class="form-group full">
            <label class="form-label">封面图 URL</label>
            <input type="url" class="form-input" id="f-cover" placeholder="https://example.com/cover.jpg">
            <small class="form-hint">留空则自动使用第一张预览图</small>
          </div>

          <div class="form-group full">
            <label class="form-label">描述 *</label>
            <textarea class="form-textarea" id="f-description" placeholder="简要介绍软件功能与特色" rows="4" required></textarea>
          </div>

          <div class="form-group full">
            <label class="form-label">标签（用逗号或空格分隔）</label>
            <input type="text" class="form-input" id="f-tags" placeholder="如：开发工具, 免费, 跨平台">
          </div>

          <div class="form-group full">
            <label class="form-label">预览图（可多张）</label>
            <div class="dynamic-list" id="imageList"></div>
            <button type="button" class="add-btn" id="btn-add-image">+ 添加图片</button>
          </div>

          <div class="form-group full">
            <label class="form-label">下载链接</label>
            <div class="dynamic-list" id="driveList"></div>
            <button type="button" class="add-btn" id="btn-add-drive">+ 添加下载</button>
          </div>

          <div class="form-group full">
            <label class="form-label">精选推荐</label>
            <label style="position:relative;display:inline-flex;align-items:center;gap:12px;cursor:pointer;user-select:none;">
              <input type="checkbox" id="f-featured" style="opacity:0;width:0;height:0;position:absolute;">
              <span class="form-switch" id="f-featured-switch"></span>
              <span style="font-size:13px;color:var(--text-secondary);">开启后将显示于首页精选区</span>
            </label>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn" id="btn-reset">重 置</button>
          <button type="submit" class="btn btn-primary">发布资源</button>
        </div>
      </form>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = 'aether.software.local';
    const $ = id => document.getElementById(id);

    // ====== 工具函数 ======
    function showToast(msg, type) {
      const t = $('toast');
      t.textContent = msg;
      t.className = 'toast show ' + (type || '');
      setTimeout(() => t.classList.remove('show'), 2400);
    }

    function genId() {
      return 'r_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
    }

    // ====== 动态行组件 ======
    function addImageRow(initialValue) {
      const row = document.createElement('div');
      row.className = 'dynamic-item';
      row.innerHTML = `
        <input type="url" class="form-input img-url" placeholder="图片 URL https://..." value="${initialValue || ''}">
        <button type="button" class="remove-btn" title="删除">✕</button>
      `;
      row.querySelector('.remove-btn').addEventListener('click', () => {
        row.style.opacity = '0';
        row.style.transform = 'translateX(-8px)';
        setTimeout(() => row.remove(), 160);
      });
      $('imageList').appendChild(row);
    }

    function addDriveRow(data) {
      data = data || {};
      const row = document.createElement('div');
      row.className = 'dynamic-item';
      row.style.gridTemplateColumns = '1fr 1fr auto';
      row.innerHTML = `
        <input type="text" class="form-input drive-name" placeholder="名称（如：百度网盘）" value="${data.name || ''}">
        <input type="text" class="form-input drive-code" placeholder="提取码（可选）" value="${data.code || ''}">
        <div style="grid-column: 1 / -1; display: grid; grid-template-columns: 1fr auto; gap: 12px;">
          <input type="url" class="form-input drive-url" placeholder="下载链接 https://..." value="${data.url || ''}">
          <button type="button" class="remove-btn" title="删除">✕</button>
        </div>
      `;
      row.querySelector('.remove-btn').addEventListener('click', () => {
        row.style.opacity = '0';
        row.style.transform = 'translateX(-8px)';
        setTimeout(() => row.remove(), 160);
      });
      $('driveList').appendChild(row);
    }

    // ====== 初始化 ======
    function initForm() {
      addImageRow();
      addDriveRow();
    }
    initForm();

    $('btn-add-image').addEventListener('click', () => addImageRow());
    $('btn-add-drive').addEventListener('click', () => addDriveRow());

    // ====== 重置 ======
    function resetForm() {
      $('publishForm').reset();
      $('imageList').innerHTML = '';
      $('driveList').innerHTML = '';
      initForm();
      showToast('已重置');
    }
    $('btn-reset').addEventListener('click', resetForm);

    // ====== 提交 ======
    $('publishForm').addEventListener('submit', e => {
      e.preventDefault();
      const title = $('f-title').value.trim();
      const description = $('f-description').value.trim();
      if (!title) { showToast('请填写标题', 'error'); return; }
      if (!description) { showToast('请填写描述', 'error'); return; }

      const images = [];
      $('imageList').querySelectorAll('.img-url').forEach(inp => {
        if (inp.value.trim()) images.push(inp.value.trim());
      });

      const drives = [];
      $('driveList').querySelectorAll('.dynamic-item').forEach(row => {
        const n = row.querySelector('.drive-name').value.trim();
        const c = row.querySelector('.drive-code').value.trim();
        const u = row.querySelector('.drive-url').value.trim();
        if (u) drives.push({ name: n || '下载链接', code: c, url: u });
      });

      const tagsRaw = ($('f-tags').value || '').split(/[,、\s]+/).map(t => t.trim()).filter(Boolean);
      const cover = $('f-cover').value.trim() || '';

      const record = {
        id: genId(),
        title,
        description,
        category: $('f-category').value || '其他',
        version: $('f-version').value.trim() || '',
        cover,
        tags: tagsRaw,
        images,
        drives,
        featured: $('f-featured').checked,
        pinned: false,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };

      const existing = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      existing.unshift(record);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(existing));

      // 导出 JSON 供下载（浏览器端无法直接写文件）
      const blob = new Blob([JSON.stringify(existing, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'software.json';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 300);

      showToast('发布成功！已导出 software.json', 'success');
      setTimeout(resetForm, 600);
    });
  </script>
</body>
</html>
