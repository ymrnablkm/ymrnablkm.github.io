<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>管理资源 · Aether Yard</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
  <div class="app-container" style="grid-template-columns: 1fr;">
    <main class="main">
      <div class="admin-header">
        <div>
          <h1 class="admin-title">管理资源</h1>
          <div class="admin-subtitle">ADMIN · MANAGE</div>
        </div>
        <nav class="admin-nav">
          <a href="publish.html" class="admin-btn">发布</a>
          <a href="manage.html" class="admin-btn active">管理</a>
          <a href="../index.html" class="admin-btn">首页</a>
        </nav>
      </div>

      <a href="sync.html" style="text-decoration:none;display:block;margin-bottom:16px;padding:16px 20px;border-radius:12px;background:linear-gradient(135deg,rgba(124,131,253,0.15),rgba(124,131,253,0.05));border:1px solid rgba(124,131,253,0.3);">
        <div style="font-size:16px;color:#7c83fd;font-weight:600;">🔄 点击这里：把本地数据同步到 GitHub</div>
        <div style="font-size:12px;color:#9fa8da;margin-top:4px;">跨浏览器/跨设备同步 · 手机端也能看到</div>
      </a>

      <div class="list-header">
        <div class="list-count" id="listCount">加载中...</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button class="btn btn-sm" id="btn-refresh">⟳ 刷新</button>
          <button class="btn btn-sm" id="btn-export">⤓ 导出 JSON</button>
          <label class="btn btn-sm" style="cursor:pointer;margin:0;" for="file-import">⤒ 导入 JSON</label>
          <input type="file" id="file-import" accept=".json,application/json" style="display:none;">
          <button class="btn btn-sm btn-danger" id="btn-clear" style="color:#ff8a8a;border-color:rgba(255,138,138,0.3);background:rgba(255,138,138,0.06);">清空</button>
        </div>
      </div>

      <div class="manage-list" id="manageList"></div>

      <div class="empty-state" id="emptyState" style="display:none;">
        <div class="empty-icon">◇</div>
        <div class="empty-text">暂无资源 · 前往发布页添加</div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = 'aether.software.local';
    const $ = id => document.getElementById(id);
    let DATA = [];

    function showToast(msg, type) {
      const t = $('toast');
      t.textContent = msg;
      t.className = 'toast show ' + (type || '');
      setTimeout(() => t.classList.remove('show'), 2400);
    }

    function load() {
      try {
        DATA = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        if (!Array.isArray(DATA)) DATA = [];
      } catch (e) { DATA = []; }
      // 同时尝试加载线上 data/software.json 以合并显示
      fetch('../data/software.json').then(r => r.ok ? r.json() : [])
        .catch(() => []).then(remote => {
          if (Array.isArray(remote) && remote.length > 0) {
            const remoteIds = new Set(remote.map(r => r.id));
            const merged = [...DATA.filter(d => !remoteIds.has(d.id)), ...remote];
            merged.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
            DATA = merged;
            render();
          } else {
            render();
          }
        });
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
      render();
    }

    function formatDate(d) {
      if (!d) return '';
      const t = new Date(d);
      if (isNaN(t)) return '';
      const y = t.getFullYear();
      const m = String(t.getMonth() + 1).padStart(2, '0');
      const dd = String(t.getDate()).padStart(2, '0');
      return `${y}.${m}.${dd}`;
    }

    function escapeHTML(str) {
      return String(str || '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    function render() {
      const list = $('manageList');
      const empty = $('emptyState');
      $('listCount').textContent = `共 ${DATA.length} 条资源`;

      if (DATA.length === 0) {
        list.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      list.innerHTML = DATA.map(item => {
        const cover = item.cover || (item.images && item.images[0]) || '';
        const thumb = cover
          ? `<img src="${escapeHTML(cover)}" alt="" style="width:100%;height:100%;object-fit:cover;">`
          : '';
        return `<div class="manage-item" data-id="${escapeHTML(item.id)}">
          <div class="manage-thumb">${thumb}</div>
          <div class="manage-info">
            <div class="manage-title">${escapeHTML(item.title)}</div>
            <div class="manage-meta">
              <span>${escapeHTML(item.category || '其他')}</span>
              <span>${item.featured ? '★ 精选' : ''}</span>
              <span>${formatDate(item.createdAt)}</span>
              <span>${item.drives ? (item.drives.length + ' 下载') : ''}</span>
            </div>
          </div>
          <div class="manage-actions">
            <button class="action-btn" data-action="toggle" data-id="${escapeHTML(item.id)}">${item.featured ? '取消精选' : '设精选'}</button>
            <button class="action-btn danger" data-action="delete" data-id="${escapeHTML(item.id)}">删除</button>
          </div>
        </div>`;
      }).join('');

      // 绑定事件
      list.querySelectorAll('[data-action]').forEach(btn => {
        btn.addEventListener('click', () => {
          const action = btn.dataset.action;
          const id = btn.dataset.id;
          const idx = DATA.findIndex(d => String(d.id) === String(id));
          if (idx < 0) return;

          if (action === 'delete') {
            if (!confirm(`确定删除 "${DATA[idx].title}" 吗？`)) return;
            DATA.splice(idx, 1);
            save();
            showToast('已删除', '');
          } else if (action === 'toggle') {
            DATA[idx].featured = !DATA[idx].featured;
            DATA[idx].updatedAt = new Date().toISOString();
            save();
            showToast('已更新', 'success');
          }
        });
      });
    }

    // 刷新
    $('btn-refresh').addEventListener('click', () => { load(); showToast('已刷新'); });

    // 导出
    $('btn-export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'software.json';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 300);
      showToast('已导出 software.json', 'success');
    });

    // 导入
    $('file-import').addEventListener('change', e => {
      const f = e.target.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = evt => {
        try {
          const parsed = JSON.parse(evt.target.result);
          const arr = Array.isArray(parsed) ? parsed : (parsed.software || []);
          if (!arr.length) { showToast('文件为空或格式错误', 'error'); return; }
          const ids = new Set(DATA.map(d => d.id));
          arr.forEach(it => {
            if (it.id && ids.has(it.id)) return;
            if (!it.id) it.id = 'imp_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
            if (!it.createdAt) it.createdAt = new Date().toISOString();
            DATA.unshift(it);
            ids.add(it.id);
          });
          DATA.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
          localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
          render();
          showToast(`导入 ${arr.length} 条`, 'success');
        } catch (err) {
          showToast('导入失败：JSON 格式错误', 'error');
        }
      };
      reader.readAsText(f);
      e.target.value = '';
    });

    // 清空
    $('btn-clear').addEventListener('click', () => {
      if (!confirm('确定清空本地所有记录？此操作不可撤销。')) return;
      DATA = [];
      localStorage.removeItem(STORAGE_KEY);
      render();
      showToast('已清空', '');
    });

    // 初始化
    load();
  </script>
</body>
</html>
