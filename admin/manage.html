<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>管理资源 · Aether Yard</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="api.js"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <style>
    .manage-header-bar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
    }
    .manage-status {
      padding: 8px 14px; background: var(--bg-card);
      border: 1px solid var(--border); border-radius: 8px;
      font-size: 13px; color: var(--text-secondary);
    }
    .manage-status strong { color: var(--accent); }
    .manage-status.pending { border-color: rgba(255, 159, 101, 0.4); color: #ffb74d; }
    .pending-dot {
      display: inline-block; width: 8px; height: 8px;
      background: #ffb74d; border-radius: 50%; margin-right: 8px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    .manage-btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

    /* 移动端 */
    @media (max-width: 768px) {
      .manage-item {
        grid-template-columns: 64px 1fr !important;
      }
      .manage-thumb { width: 64px; height: 64px; }
      .manage-actions {
        grid-column: 1 / -1;
        flex-wrap: wrap;
        padding-top: 8px;
        border-top: 1px solid var(--border);
        margin-top: 8px;
      }
      .manage-title { font-size: 14px; }
      .manage-meta { font-size: 11px; }
      .action-btn { padding: 8px 10px; font-size: 12px; flex: 1; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="app-container" style="grid-template-columns: 1fr;">
    <main class="main">
      <div class="admin-header">
        <div>
          <h1 class="admin-title">管理资源</h1>
          <div class="admin-subtitle">ADMIN · MANAGE</div>
        </div>
        <nav class="admin-nav">
          <a href="publish.html" class="admin-btn">发布</a>
          <a href="manage.html" class="admin-btn active">管理</a>
          <a href="sync.html" class="admin-btn">Token</a>
          <a href="../index.html" class="admin-btn">首页</a>
        </nav>
      </div>

      <div class="manage-header-bar">
        <div class="manage-status" id="syncStatus">
          <span id="syncIcon">📦</span>
          <span id="syncInfo">加载中...</span>
        </div>
        <div class="manage-btn-group">
          <button class="btn btn-sm" id="btn-refresh">⟳ 刷新</button>
          <button class="btn btn-sm" id="btn-sync">⬆ 同步到 GitHub</button>
          <button class="btn btn-sm" id="btn-export">⤓ 导出</button>
          <label class="btn btn-sm" style="cursor: pointer; margin: 0;" for="file-import">⤒ 导入</label>
          <input type="file" id="file-import" accept=".json,application/json" style="display:none;">
          <button class="btn btn-sm" id="btn-clear" style="color: #ff8a8a; border-color: rgba(255, 138, 138, 0.3); background: rgba(255, 138, 138, 0.06);">清空</button>
        </div>
      </div>

      <div class="manage-list" id="manageList"></div>

      <div class="empty-state" id="emptyState" style="display:none;">
        <div class="empty-icon">◇</div>
        <div class="empty-text">暂无资源 · 前往发布页添加</div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const $ = function (id) { return document.getElementById(id); };
    const API = window.AetherAPI;
    let DATA = [];

    function showToast(msg, type) {
      const t = $('toast');
      t.innerHTML = msg;
      t.className = 'toast show ' + (type || '');
      setTimeout(function () { t.classList.remove('show'); }, type === 'error' ? 5000 : 3000);
    }

    function formatDate(d) {
      if (!d) return '';
      const t = new Date(d);
      if (isNaN(t)) return '';
      return t.getFullYear() + '.' + String(t.getMonth() + 1).padStart(2, '0') + '.' + String(t.getDate()).padStart(2, '0');
    }

    function escapeHTML(str) {
      return String(str || '').replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }

    function renderCover(cover) {
      if (!cover) return '';
      if (/^https?:\/\//i.test(cover) || cover.startsWith('data:')) {
        return '<img src="' + escapeHTML(cover) + '" alt="" style="width:100%;height:100%;object-fit:cover;">';
      }
      // emoji
      return '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:36px;">' + escapeHTML(cover) + '</div>';
    }

    function updateStatusBar() {
      const el = $('syncStatus');
      const info = $('syncInfo');
      const icon = $('syncIcon');
      const pending = API.isPending();
      const hasToken = API.hasToken();
      const count = DATA.length;

      if (pending) {
        el.classList.add('pending');
        icon.innerHTML = '<span class="pending-dot"></span>';
        info.innerHTML = '有 <strong>' + count + '</strong> 条资源 · 正在同步到 GitHub...';
      } else if (hasToken) {
        el.classList.remove('pending');
        icon.innerHTML = '✓';
        info.innerHTML = '已连接 GitHub · 共 <strong>' + count + '</strong> 条资源';
      } else {
        el.classList.remove('pending');
        icon.innerHTML = '🔒';
        info.innerHTML = '本地 <strong>' + count + '</strong> 条 · 需配置 Token 才能同步到 GitHub';
      }
    }

    function render() {
      const list = $('manageList');
      const empty = $('emptyState');

      if (!DATA || DATA.length === 0) {
        list.innerHTML = '';
        empty.style.display = 'block';
      } else {
        empty.style.display = 'none';
        list.innerHTML = DATA.map(function (item) {
          const cover = item.cover || (item.images && item.images[0]) || '';
          const thumb = renderCover(cover);
          const pinned = item.pinned ? '<span style="color:#ffb74d;margin-right:6px;">📌</span>' : '';
          const feat = item.featured ? '<span style="color:#7c83fd;margin-right:6px;">★</span>' : '';

          return '<div class="manage-item" data-id="' + escapeHTML(item.id) + '">' +
            '<div class="manage-thumb" style="width:72px;height:72px;border-radius:8px;overflow:hidden;background:var(--bg-soft);border:1px solid var(--border);flex-shrink:0;">' + thumb + '</div>' +
            '<div class="manage-info">' +
              '<div class="manage-title">' + pinned + feat + escapeHTML(item.title) + '</div>' +
              '<div class="manage-meta">' +
                '<span>' + escapeHTML(item.category || '其他') + '</span>' +
                '<span>' + formatDate(item.createdAt) + '</span>' +
                (item.drives ? '<span>' + item.drives.length + ' 下载</span>' : '') +
                (item.images && item.images.length ? '<span>' + item.images.length + ' 图</span>' : '') +
              '</div>' +
            '</div>' +
            '<div class="manage-actions">' +
              '<a class="action-btn" href="publish.html?id=' + encodeURIComponent(item.id) + '">✏️ 编辑</a>' +
              '<button class="action-btn" data-action="toggle" data-id="' + escapeHTML(item.id) + '">' + (item.featured ? '取消精选' : '设精选') + '</button>' +
              '<button class="action-btn" data-action="pin" data-id="' + escapeHTML(item.id) + '">' + (item.pinned ? '取消置顶' : '置顶') + '</button>' +
              '<button class="action-btn danger" data-action="delete" data-id="' + escapeHTML(item.id) + '">删除</button>' +
            '</div>' +
          '</div>';
        }).join('');

        // 绑定事件
        list.querySelectorAll('[data-action]').forEach(function (btn) {
          btn.addEventListener('click', async function () {
            const action = btn.dataset.action;
            const id = btn.dataset.id;
            const item = DATA.find(function (d) { return String(d.id) === String(id); });
            if (!item) return;

            if (action === 'delete') {
              if (!confirm('确定删除 "' + item.title + '" ？')) return;
              btn.textContent = '删除中...';
              btn.disabled = true;
              try {
                await API.remove(id, function (msg, stage) {
                  if (stage === 'local') showToast('✓ 本地已删除', '');
                  else if (stage === 'done') showToast('🎉 已同步到 GitHub', 'success');
                  else if (stage === 'error') showToast('⚠️ ' + msg, 'error');
                  else showToast(msg);
                });
                refresh();
              } catch (err) {
                showToast('删除失败：' + err.message, 'error');
              }
            } else if (action === 'toggle') {
              btn.textContent = '更新中...';
              btn.disabled = true;
              try {
                await API.update(id, { featured: !item.featured }, function (msg, stage) {
                  if (stage === 'local') { showToast('✓ 已更新', ''); }
                  else if (stage === 'done') showToast('🎉 已同步到 GitHub', 'success');
                  else if (stage === 'error') showToast('⚠️ ' + msg, 'error');
                });
                refresh();
              } catch (err) {
                showToast('更新失败：' + err.message, 'error');
              }
            } else if (action === 'pin') {
              btn.textContent = '更新中...';
              btn.disabled = true;
              try {
                await API.update(id, { pinned: !item.pinned }, function (msg, stage) {
                  if (stage === 'local') showToast('✓ 已更新', '');
                  else if (stage === 'done') showToast('🎉 已同步到 GitHub', 'success');
                  else if (stage === 'error') showToast('⚠️ ' + msg, 'error');
                });
                refresh();
              } catch (err) {
                showToast('更新失败：' + err.message, 'error');
              }
            }
          });
        });
      }

      updateStatusBar();
    }

    async function refresh(skipRemote) {
      const result = await API.loadSmart(skipRemote);
      DATA = (result.data || []).slice().sort(function (a, b) {
        if (a.pinned && !b.pinned) return -1;
        if (!a.pinned && b.pinned) return 1;
        return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
      });
      if (result.changed && !skipRemote) {
        showToast('✓ 检测到远端新数据', 'success');
      }
      render();
    }

    // ===== 操作按钮 =====
    $('btn-refresh').addEventListener('click', function () {
      showToast('正在刷新...');
      refresh(false);
    });

    $('btn-sync').addEventListener('click', async function () {
      const btn = $('btn-sync');
      const oldText = btn.textContent;
      btn.disabled = true; btn.textContent = '⏳ 同步中...';
      try {
        await API.syncNow(function (msg, stage) {
          if (stage === 'done') showToast('🎉 ' + msg, 'success');
          else if (stage === 'error') showToast('⚠️ ' + msg, 'error');
          else showToast(msg);
        });
      } catch (err) {
        showToast('同步失败：' + err.message, 'error');
      } finally {
        btn.disabled = false; btn.textContent = oldText;
        refresh(true);
      }
    });

    $('btn-export').addEventListener('click', function () {
      API.exportJSON();
      showToast('已导出 software.json', 'success');
    });

    $('file-import').addEventListener('change', async function (e) {
      const f = e.target.files[0];
      if (!f) return;
      try {
        await API.importJSON(f);
        showToast('✓ 已导入，正在同步...', 'success');
        refresh(true);
      } catch (err) {
        showToast('导入失败：' + err.message, 'error');
      }
      e.target.value = '';
    });

    $('btn-clear').addEventListener('click', async function () {
      if (!confirm('确定清空本地所有记录？此操作不可撤销。')) return;
      try {
        await API.updateData([], function (msg, stage) {
          if (stage === 'done') showToast('已清空并同步', 'success');
          else if (stage === 'local') showToast('已清空本地', '');
          else if (stage === 'error') showToast('⚠️ ' + msg, 'error');
        });
        refresh(true);
      } catch (err) {
        showToast('清空失败：' + err.message, 'error');
      }
    });

    // ===== 初始化 =====
    refresh(false);
  </script>
</body>
</html>
