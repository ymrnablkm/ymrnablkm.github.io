<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>外站导航 · Aether Yard</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
  <button class="menu-toggle" id="menuToggle" aria-label="菜单">☰</button>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="sidebar-header-close" id="sidebarClose" aria-label="关闭">✕</button>
        <div>
          <div class="logo-text">Aether Yard</div>
          <div class="logo-subtitle">RESOURCE HUB</div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">导航</div>
          <a href="index.html" class="nav-link"><span class="nav-icon">⌂</span>首页</a>
          <a href="software.html" class="nav-link"><span class="nav-icon">⊞</span>软件库</a>
          <a href="sites.html" class="nav-link active"><span class="nav-icon">🔗</span>外站导航</a>
          <a href="about.html" class="nav-link"><span class="nav-icon">◉</span>关于</a>
        </div>
      </nav>
    </aside>

    <main class="main">
      <section class="hero" style="padding: var(--space-8) 0 var(--space-6);">
        <div class="hero-badge">EXTERNAL LINKS</div>
        <h1 class="hero-title">外站导航</h1>
        <p class="hero-subtitle">精选好用的网站，一键直达。</p>
      </section>

      <section id="sitesContainer"></section>
    </main>
  </div>

  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="empty-icon">◇</div>
    <div class="empty-text">暂无导航</div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    function escapeHTML(str) {
      return String(str || '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    const menuToggle = document.getElementById('menuToggle');
    const sidebarClose = document.getElementById('sidebarClose');
    const overlay = document.getElementById('sidebarOverlay');
    menuToggle.addEventListener('click', () => document.body.classList.add('sidebar-open'));
    sidebarClose.addEventListener('click', () => document.body.classList.remove('sidebar-open'));
    overlay.addEventListener('click', () => document.body.classList.remove('sidebar-open'));

    function renderSites(data) {
      const container = document.getElementById('sitesContainer');
      const empty = document.getElementById('emptyState');

      let groups = [];
      if (Array.isArray(data)) {
        // 扁平数组：兼容 [{ name, url, desc }] 格式
        groups = [{ category: '精选推荐', sites: data }];
      } else if (data && data.sites && Array.isArray(data.sites)) {
        // 嵌套结构：{ sites: [{ category, sites: [...] }] }
        groups = data.sites.filter(g => g && Array.isArray(g.sites) && g.sites.length > 0);
      }

      if (!groups || groups.length === 0) {
        // 默认兜底数据
        groups = [
          {
            category: '开发工具',
            sites: [
              { name: 'GitHub', url: 'https://github.com', desc: '全球最大代码托管平台', icon: 'G' },
              { name: 'VS Code', url: 'https://code.visualstudio.com', desc: '轻量级代码编辑器', icon: 'VS' },
              { name: 'Figma', url: 'https://figma.com', desc: '协作界面设计工具', icon: 'Fi' },
              { name: 'MDN', url: 'https://developer.mozilla.org', desc: 'Web 开发者权威文档', icon: 'M' }
            ]
          }
        ];
      }

      container.innerHTML = groups.map(group => {
        const cardsHTML = group.sites.map(site => {
          const letter = (site.icon || (site.name || '?').charAt(0)).toUpperCase().slice(0, 2);
          const title = escapeHTML(site.title || site.name || 'Untitled');
          const desc = escapeHTML(site.description || site.desc || '');
          const url = escapeHTML(site.url || '#');
          return `<a href="${url}" target="_blank" class="site-card">
            <div class="site-favicon">${letter}</div>
            <div class="site-title">${title}</div>
            <div class="site-desc">${desc}</div>
          </a>`;
        }).join('');

        return `<section class="section" style="margin-top: var(--space-8);">
          <div class="section-header">
            <div class="section-title">${escapeHTML(group.category || '精选推荐')}</div>
          </div>
          <div class="site-grid">${cardsHTML}</div>
        </section>`;
      }).join('');

      empty.style.display = 'none';
    }

    fetch('data/sites.json')
      .then(r => r.ok ? r.json() : ({}))
      .catch(() => ({}))
      .then(data => renderSites(data));
  </script>
</body>
</html>
