<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>外站导航 · Aether Yard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <button class="menu-toggle" id="menuToggle">☰</button>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-header-inner">
          <div class="logo">AY</div>
          <div class="logo-sub">Software Repository</div>
        </div>
        <button class="sidebar-close" onclick="closeSidebar()">✕</button>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">导航</div>
          <a href="index.html" class="nav-link"><span class="icon">⌂</span> 首页</a>
          <a href="software.html" class="nav-link"><span class="icon">⊞</span> 软件库</a>
          <a href="sites.html" class="nav-link active"><span class="icon">🔗</span> 外站导航</a>
          <a href="about.html" class="nav-link"><span class="icon">◉</span> 关于</a>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">快捷分类</div>
          <a href="software.html?cat=软件" class="nav-link"><span class="icon">⊞</span> 软件工具</a>
          <a href="software.html?cat=资源" class="nav-link"><span class="icon">◈</span> 设计资源</a>
          <a href="software.html?cat=游戏" class="nav-link"><span class="icon">⬡</span> 游戏相关</a>
        </div>
      </nav>

      <div class="sidebar-sites">
        <div class="nav-section-title">常用站点</div>
        <a href="https://github.com" target="_blank" class="site-link"><span class="favicon">G</span> GitHub</a>
        <a href="https://notion.so" target="_blank" class="site-link"><span class="favicon">N</span> Notion</a>
        <a href="https://figma.com" target="_blank" class="site-link"><span class="favicon">F</span> Figma</a>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h1 class="page-title">外站导航</h1>
        <p class="page-subtitle">收录优质工具与资源网站，持续更新</p>
      </div>

      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="搜索网站名称或描述...">
      </div>

      <div id="sitesContainer">
        <div class="loading"><div class="loading-spinner"></div></div>
      </div>
    </main>
  </div>

  <script>
    let allSites = [];
    let currentSearch = '';

    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function loadData() {
      try {
        const response = await fetch('data/sites.json');
        allSites = await response.json();
        render();
      } catch (error) {
        console.error('加载失败:', error);
        document.getElementById('sitesContainer').innerHTML = '<div class="empty-state"><p>数据加载失败</p></div>';
      }
    }

    function render() {
      // 支持两种数据结构: { categories: [...] } 或 { sites: [...] }
      let categories = allSites.categories || allSites.sites || [];
      
      if (currentSearch) {
        const query = currentSearch.toLowerCase();
        categories = categories.map(cat => ({
          ...cat,
          sites: cat.sites.filter(s => 
            s.name.toLowerCase().includes(query) ||
            (s.desc && s.desc.toLowerCase().includes(query))
          )
        })).filter(cat => cat.sites.length > 0);
      }

      if (categories.length === 0) {
        document.getElementById('sitesContainer').innerHTML = `
          <div class="empty-state">
            <div class="icon">🔍</div>
            <h3>未找到相关网站</h3>
            <p>试试其他关键词</p>
          </div>
        `;
        return;
      }

      const html = categories.map((cat, i) => `
        <div class="sites-category" style="animation: fadeInUp 0.4s ease-out; animation-delay: ${i * 60}ms; animation-fill-mode: backwards;">
          <div class="sites-category-header">
            <span class="icon">${escapeHTML(cat.icon || '◈')}</span>
            <span>${escapeHTML(cat.name)}</span>
          </div>
          <div class="sites-list">
            ${(cat.sites || []).map(site => `
              <a href="${escapeHTML(site.url)}" target="_blank" rel="noopener noreferrer" class="site-item">
                <div class="site-item-icon">${escapeHTML(site.icon || site.name.charAt(0))}</div>
                <div class="site-item-info">
                  <div class="site-item-name">${escapeHTML(site.name)}</div>
                  <div class="site-item-desc">${escapeHTML(site.desc || '')}</div>
                </div>
              </a>
            `).join('')}
          </div>
        </div>
      `).join('');

      document.getElementById('sitesContainer').innerHTML = html;
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      currentSearch = e.target.value;
      render();
    });

    document.getElementById('menuToggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebarOverlay').classList.toggle('show');
    });
    
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').classList.remove('show');
    }
    
    document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);

    loadData();
  </script>
</body>
</html>
