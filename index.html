<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aether Yard · 精选软件资源库</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
  <button class="menu-toggle" id="menuToggle" aria-label="菜单">☰</button>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="app-container">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="sidebar-header-close" id="sidebarClose" aria-label="关闭">✕</button>
        <div>
          <div class="logo-text">Aether Yard</div>
          <div class="logo-sub">RESOURCE HUB</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">导航</div>
          <a href="index.html" class="nav-link active"><span class="icon">⌂</span> 首页</a>
          <a href="software.html" class="nav-link"><span class="icon">⊞</span> 软件库</a>
          <a href="sites.html" class="nav-link"><span class="icon">🔗</span> 外站导航</a>
          <a href="about.html" class="nav-link"><span class="icon">◉</span> 关于</a>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">快捷分类</div>
          <a href="software.html?cat=软件" class="nav-link"><span class="icon">▣</span> 软件工具</a>
          <a href="software.html?cat=影视动漫" class="nav-link"><span class="icon">▶</span> 影视动漫</a>
          <a href="software.html?cat=PC工具" class="nav-link"><span class="icon">⚙</span> PC 工具</a>
          <a href="software.html?cat=游戏相关" class="nav-link"><span class="icon">🎮</span> 游戏相关</a>
          <a href="software.html?cat=其他" class="nav-link"><span class="icon">◇</span> 其他资源</a>
        </div>
      </nav>

      <div class="sidebar-sites">
        <div class="nav-section-title">常用站点</div>
        <a href="https://github.com" target="_blank" class="site-link"><span class="favicon">G</span> GitHub</a>
        <a href="https://code.visualstudio.com" target="_blank" class="site-link"><span class="favicon">V</span> VS Code</a>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main">
      <!-- Hero -->
      <section class="hero">
        <span class="hero-label">CURATED · SINCE 2024</span>
        <h1 class="hero-title">精选软件 · <span class="accent">数字资源库</span></h1>
        <p class="hero-subtitle">实用工具、影视资源、创作素材 —— 精心整理，持续更新。</p>
        <div class="hero-cta">
          <a href="software.html" class="btn btn-primary">浏览软件库 →</a>
          <a href="sites.html" class="btn">外站导航</a>
        </div>
        <div class="hero-stats" id="statsBar"></div>
      </section>

      <!-- 精选推荐 -->
      <section class="section">
        <div class="section-header">
          <div class="section-title">精选推荐</div>
          <a href="software.html" class="section-link">查看全部 →</a>
        </div>
        <div class="card-grid" id="featuredGrid"></div>
      </section>

      <!-- 最新更新 -->
      <section class="section">
        <div class="section-header">
          <div class="section-title">最新更新</div>
          <a href="software.html" class="section-link">查看全部 →</a>
        </div>
        <div class="card-grid" id="latestGrid"></div>
      </section>
    </main>
  </div>

  <!-- 图片预览模态 -->
  <div class="image-modal" id="imageModal">
    <img id="modalImage" src="" alt="预览">
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // ====== 通用工具函数 ======
    function escapeHTML(str) {
      return String(str || '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d)) return '';
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}.${m}.${day}`;
    }

    function renderEmpty(text) {
        return `<div class="empty-state" style="grid-column: 1 / -1;">
          <div class="empty-icon">◇</div>
          <div class="empty-text">${escapeHTML(text)}</div>
        </div>`;
    }

    function renderCardItem(item, i) {
      const cover = item.cover || (item.images && item.images[0]) || '';
      const coverHTML = cover
        ? `<img class="card-image" src="${escapeHTML(cover)}" alt="${escapeHTML(item.title)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
           <div class="card-image-placeholder" style="display:none;">📦</div>`
        : `<div class="card-image-placeholder">📦</div>`;

      const tags = (item.tags && item.tags.length > 0)
        ? `<div class="card-tags">${item.tags.slice(0, 3).map(t => `<span class="tag">${escapeHTML(t)}</span>`).join('')}</div>`
        : '';

      const badge = (item.featured || item.pinned)
        ? `<span class="card-badge">精选</span>`
        : '';

      return `<article class="software-card" data-id="${escapeHTML(item.id)}" onclick="location.href='software.html?id=${encodeURIComponent(item.id)}'">
        <div class="card-media">
          ${badge}
          ${coverHTML}
        </div>
        <div class="card-body">
          <div class="card-header">
            <div class="card-title">${escapeHTML(item.title)}</div>
            <div class="card-category">${escapeHTML(item.category || '其他')}</div>
          </div>
          <div class="card-desc">${escapeHTML(item.description || '暂无简介')}</div>
          ${tags}
        </div>
        <div class="card-footer">
          <span class="card-date">${formatDate(item.createdAt || item.updatedAt) || '—'}</span>
          <span class="card-action">查看 →</span>
        </div>
      </article>`;
    }

    // ====== 数据加载与渲染 ======
    let DATA = [];

    function loadData() {
      return fetch('data/software.json')
        .then(r => r.ok ? r.json() : [])
        .catch(() => []);
    }

    function renderStats(list) {
      const total = list.length;
      const categories = {};
      list.forEach(i => {
        const cat = i.category || '其他';
        categories[cat] = (categories[cat] || 0) + 1;
      });
      const catCount = Object.keys(categories).length;
      const drives = list.reduce((sum, i) => sum + ((i.drives && i.drives.length) || 0), 0);

      document.getElementById('statsBar').innerHTML = `
        <div class="stat-item">
          <div class="stat-value">${total}</div>
          <div class="stat-label">资源</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">${catCount}</div>
          <div class="stat-label">分类</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">${drives}</div>
          <div class="stat-label">下载源</div>
        </div>`;
    }

    function renderCards(list) {
      const featuredGrid = document.getElementById('featuredGrid');
      const latestGrid = document.getElementById('latestGrid');

      if (!list || list.length === 0) {
        featuredGrid.innerHTML = renderEmpty('暂无资源');
        latestGrid.innerHTML = renderEmpty('暂无资源');
        return;
      }

      list.forEach(s => {
        if (!s.description && s.desc) s.description = s.desc;
        if (s.content && !s.description) s.description = s.content;
      });

      const featured = list.filter(s => s.featured || s.pinned).slice(0, 6);
      featuredGrid.innerHTML = featured.length > 0
        ? featured.map((s, i) => renderCardItem(s, i)).join('')
        : renderEmpty('暂无精选');

      const latest = [...list]
        .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0))
        .slice(0, 6);
      latestGrid.innerHTML = latest.length > 0
        ? latest.map((s, i) => renderCardItem(s, i)).join('')
        : renderEmpty('暂无最新');
    }

    // ====== 侧边栏交互 ======
    const menuToggle = document.getElementById('menuToggle');
    const sidebarClose = document.getElementById('sidebarClose');
    const overlay = document.getElementById('sidebarOverlay');

    function openSidebar() { document.body.classList.add('sidebar-open'); }
    function closeSidebar() { document.body.classList.remove('sidebar-open'); }

    menuToggle.addEventListener('click', openSidebar);
    sidebarClose.addEventListener('click', closeSidebar);
    overlay.addEventListener('click', closeSidebar);

    // ESC 关闭侧边栏
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeSidebar();
    });

    // ====== 图片预览 ======
    const imageModal = document.getElementById('imageModal');
    const modalImage = document.getElementById('modalImage');
    imageModal.addEventListener('click', () => imageModal.classList.remove('show'));

    // ====== 初始化 ======
    loadData().then(data => {
      DATA = Array.isArray(data) ? data : [];
      renderStats(DATA);
      renderCards(DATA);
    });
  </script>
</body>
</html>
