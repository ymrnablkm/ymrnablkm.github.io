backend:
  name: github
  repo: ymrnablkm/ymrnablkm.github.io
  branch: main
  base_url: /api
  auth_endpoint: auth

media_folder: public/uploads
public_folder: /uploads

locale: zh

collections:
  # ===== 博客文章 =====
  - name: blog
    label: "📝 博客文章"
    label_singular: "文章"
    folder: src/content/blog
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} — {{category}}"
    sortable_fields:
      fields:
        - pubDate
        - title
        - category
      default:
        field: pubDate
        direction: descending
    fields:
      - { label: "标题", name: title, widget: string, required: true, hint: "文章的标题" }
      - { label: "摘要", name: description, widget: text, required: true, hint: "一句话介绍这篇文章" }
      - { label: "封面图", name: cover, widget: image, required: false, hint: "可选，不填也能发" }
      - label: "分类"
        name: category
        widget: select
        required: true
        hint: "选一个分类"
        options:
          - "实用教程"
          - "软件推荐"
          - "开发工具"
          - "学习资源"
          - "资源网站"
          - "技术分享"
          - "前端开发"
          - "后端开发"
          - "绿化软件"
          - "游戏相关"
          - "影视动漫"
          - "其他"
      - { label: "标签", name: tags, widget: list, required: false, hint: "可选，每行一个标签" }
      - { label: "发布日期", name: pubDate, widget: datetime, required: true, hint: "默认当前时间" }
      - { label: "置顶", name: featured, widget: boolean, default: false, hint: "开启后文章在首页置顶" }
      - { label: "草稿", name: draft, widget: boolean, default: false, hint: "开启后文章不会显示在网站上" }
      - label: "下载链接"
        name: downloadLinks
        widget: list
        required: false
        hint: "可选，添加资源下载链接"
        fields:
          - label: "网盘"
            name: name
            widget: select
            required: true
            options:
              - "百度网盘"
              - "阿里云盘"
              - "夸克网盘"
              - "123网盘"
              - "蓝奏云"
              - "天翼云盘"
              - "移动云盘"
              - "迅雷云盘"
              - "GitHub"
              - "其他"
          - { label: "链接地址", name: url, widget: string, required: true, hint: "下载链接" }
          - { label: "提取码", name: password, widget: string, required: false, hint: "提取码或解压码，没有就不填" }
      - { label: "正文内容", name: body, widget: markdown, required: true, hint: "写文章内容" }

  # ===== 外站导航 =====
  - name: sites
    label: "🔗 外站导航"
    label_singular: "网站"
    file: src/content/sites/sites.json
    fields:
      - label: "网站列表"
        name: sites
        widget: list
        required: false
        hint: "添加、删除、排序外站导航"
        fields:
          - { label: "网站名称", name: name, widget: string, required: true }
          - { label: "官网链接", name: url, widget: string, required: true }
          - { label: "一句话介绍", name: description, widget: string, required: true }
          - label: "所属分类"
            name: category
            widget: select
            required: true
            options:
              - "开发工具"
              - "学习资源"
              - "资源网站"
              - "设计素材"
              - "在线工具"
              - "社区论坛"
              - "其他"
          - { label: "网站图标", name: icon, widget: string, required: false, hint: "图标链接，不填显示默认图标" }

  # ===== 友情链接 =====
  - name: friends
    label: "🤝 友情链接"
    label_singular: "友链"
    file: src/content/friends/friends.json
    fields:
      - label: "友链列表"
        name: friends
        widget: list
        required: false
        hint: "添加、删除友情链接"
        fields:
          - { label: "网站名称", name: name, widget: string, required: true }
          - { label: "网站链接", name: url, widget: string, required: true }
          - { label: "头像链接", name: avatar, widget: string, required: false, hint: "不填显示首字母" }
          - { label: "网站介绍", name: description, widget: string, required: true }

  # ===== 站点设置 =====
  - name: settings
    label: "⚙️ 站点设置"
    label_singular: "设置"
    file: src/content/settings/settings.json
    fields:
      - { label: "站点名称", name: siteName, widget: string, required: false, hint: "网站名字" }
      - { label: "站点描述", name: siteDescription, widget: text, required: false, hint: "一句话描述你的网站" }
      - { label: "公告内容", name: announcement, widget: text, required: false, hint: "显示在首页的公告" }
      - { label: "开启公告", name: announcementEnabled, widget: boolean, default: true, hint: "关掉就不显示公告" }
      - { label: "联系邮箱", name: contactEmail, widget: string, required: false }
      - { label: "页脚文字", name: footerText, widget: string, required: false, hint: "版权信息" }
      - { label: "备案号", name: icp, widget: string, required: false, hint: "没有就不填" }
